<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto 2 - Gestión de Notas</title>
    <link rel="stylesheet" href="styles.css">
    <script src="reto2.js" defer></script>
</head>
<body>
    <div class="container">
        <form id="formulario">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
                <label for="nota1">Certamen 1:</label>
                <input type="number" id="nota1" min="0" max="100" required>
            </div>
            <div class="form-group">
                <label for="nota2">Certamen 2:</label>
                <input type="number" id="nota2" min="0" max="100" required>
            </div>
            <div class="form-group">
                <label for="nota3">Certamen 3:</label>
                <input type="number" id="nota3" min="0" max="100" required>
            </div>
            <button type="submit">Agregar Alumno</button>
            <p id="mensaje"></p>
        </form>

        <div id="resultados" class="oculto">
            <h2>Resultados del Curso</h2>
            <div id="lista-alumnos"></div>
            <div id="estadisticas"></div>
            <div id="ranking"></div>
        </div>
    </div>
</body>
</html>
